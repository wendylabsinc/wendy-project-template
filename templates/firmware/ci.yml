name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32c5
          - esp32c6
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target ${{ matrix.target }}
          idf.py build
      - name: Create merged binary
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd build
          esptool.py --chip ${{ matrix.target }} merge_bin \
            -o firmware_${{ matrix.target }}.bin \
            --flash_mode dio \
            --flash_size 4MB \
            @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: build/firmware_${{ matrix.target }}.bin

  nightly:
    name: Nightly release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist/
      - name: Update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --prerelease \
            --title "Nightly" \
            --notes "Automated nightly build from \`main\` ($(date -u '+%Y-%m-%d %H:%M UTC')), commit ${{ github.sha }}" \
            dist/*.bin
