name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32c5
          - esp32c6
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py build
      - name: Create merged binary
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd build
          esptool.py --chip ${{ matrix.target }} merge_bin \
            -o firmware_${{ matrix.target }}.bin \
            --flash_mode dio \
            --flash_size 4MB \
            @flash_args
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: build/firmware_${{ matrix.target }}.bin

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes dist/*.bin
